rules:
  - name: vpn-static
    filter:
      - geosite:openai
      - geosite:cursor
      - geosite:anthropic
      - domain:2ip.io
    outbound: через конкретную tailscale exit node

  - name: vpn-sub
    filter:
      - geosite:ru-blocked
      - geoip:ru-blocked
      - geosite:youtube
      - geosite:telegram
      - geoip:telegram
      - geosite:whatsapp
      - domain:ifconfig.me
    outbound: через VPN subscription

  - name: test-direct
    filter:
      - domain:icanhazip.com
    outbound: direct

  - name: test-block
    filter:
      - domain:theuselessweb.com
      - domain:block.routecraft.test
    outbound: reject

  - name: default
    outbound: direct
