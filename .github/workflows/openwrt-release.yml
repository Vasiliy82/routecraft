name: Build OpenWrt PoC release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build architecture bundles and checksums
        shell: pwsh
        run: ./scripts/package-openwrt.ps1
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .cache/releases/*.tar.gz .cache/releases/*.sha256 poc/install-openwrt.sh --title "$GITHUB_REF_NAME" --generate-notes
